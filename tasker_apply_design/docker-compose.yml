services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasker
      POSTGRES_USER: tasker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasker_dev_password}
    volumes:
      - tasker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasker -d tasker"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tasker:${POSTGRES_PASSWORD:-tasker_dev_password}@db:5432/tasker
      SECRET_KEY: ${SECRET_KEY:-replace-this-with-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tasker.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TaskerDemo!2026}
      ASAAS_ENV: ${ASAAS_ENV:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PORT: 8000
    ports:
      - "8000:8000"
volumes:
  tasker_pgdata:
