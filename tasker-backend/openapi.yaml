components:
  schemas:
    Anuncio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        distancia_km:
          type: number
          format: double
          readOnly: true
        nm_titulo:
          type: string
          maxLength: 100
        nm_descricao:
          type: string
          maxLength: 2000
        imagens: {}
        dias_atendimento: {}
        vl_preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        nr_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        nr_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        nm_area_atendimento:
          type: string
          maxLength: 100
        nm_disponibilidade:
          type: string
          maxLength: 45
        st_anuncio:
          type: boolean
        dt_criacao_anuncio:
          type: string
          format: date-time
          readOnly: true
        fk_id_usuario:
          type: integer
          readOnly: true
        fk_id_categoria:
          type: integer
      required:
      - distancia_km
      - dt_criacao_anuncio
      - fk_id_categoria
      - fk_id_usuario
      - id
      - nm_area_atendimento
      - nm_descricao
      - nm_disponibilidade
      - nm_titulo
      - vl_preco
    Avaliacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fk_id_contratacao:
          type: integer
        avaliador_nome:
          type: string
          readOnly: true
        avaliado_nome:
          type: string
          readOnly: true
        nr_nota:
          type: integer
          maximum: 5
          minimum: 1
          description: Nota de 1 a 5 estrelas
        ds_comentario:
          type: string
          nullable: true
        dt_criacao:
          type: string
          format: date-time
          readOnly: true
        avaliador:
          type: integer
          readOnly: true
        avaliado:
          type: integer
          readOnly: true
      required:
      - avaliado
      - avaliado_nome
      - avaliador
      - avaliador_nome
      - dt_criacao
      - fk_id_contratacao
      - id
      - nr_nota
    Bloqueio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bloqueado:
          type: integer
      required:
      - bloqueado
      - id
    Calendario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
