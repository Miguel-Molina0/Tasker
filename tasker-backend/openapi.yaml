openapi: 3.0.3
info:
  title: Tasker API
  version: 1.1.0
paths:
  /api/anuncios/:
    get:
      operationId: anuncios_list
      parameters:
      - in: query
        name: fk_id_categoria
        schema:
          type: integer
      - in: query
        name: fk_id_usuario
        schema:
          type: integer
      - in: query
        name: latitude
        schema:
          type: number
      - in: query
        name: longitude
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: preco_max
        schema:
          type: number
      - in: query
        name: preco_min
        schema:
          type: number
      - in: query
        name: raio_km
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: st_anuncio
        schema:
          type: boolean
      tags:
      - anuncios
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnuncioList'
          description: ''
    post:
      operationId: anuncios_create
      tags:
      - anuncios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Anuncio'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Anuncio'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Anuncio'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
          description: ''
